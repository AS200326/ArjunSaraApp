name: Build Mogudu Pellam

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check ZIP file
        run: |
          echo "Files in repository:"
          ls -la
          test -f "MoguduPellam_PREMIUM_PIN_TO_PIN_FEATURES_FINAL.zip"

      - name: Extract Android Project
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -o "MoguduPellam_PREMIUM_PIN_TO_PIN_FEATURES_FINAL.zip" -d extracted

      - name: Find Gradle Project
        run: |
          PROJECT_DIR=$(find extracted -name settings.gradle -print -quit | xargs dirname)
          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/app/build.gradle"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mogudu-Pellam-Premium-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
