name: Build Mogudu Pellam APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find Project
        run: |
          find . -name AndroidManifest.xml
          find . -name build.gradle

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find . -name AndroidManifest.xml -print -quit)")
          PROJECT_DIR=$(dirname "$(dirname "$(dirname "$PROJECT_DIR")")")
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mogudu-Pellam-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
