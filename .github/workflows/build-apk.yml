name: Build Mogudu Pellam APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android Project
        run: |
          unzip -o "MoguduPellam_19_Features_LoveStory_FINAL_FIXED.zip" -d extracted

      - name: Find Gradle Project
        run: |
          PROJECT_DIR=$(find extracted -name settings.gradle -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project found at: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Build APK
        run: |
          PROJECT_DIR=$(find extracted -name settings.gradle -print -quit | xargs dirname)
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mogudu-Pellam-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
