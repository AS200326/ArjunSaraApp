name: Build Mogudu Pellam APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check Project
        run: |
          echo "Current folder:"
          pwd
          echo "Files:"
          ls -la
          echo "Gradle files:"
          find . -maxdepth 2 -type f \( -name "build.gradle" -o -name "settings.gradle" \) -print

      - name: Build APK
        run: |
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mogudu-Pellam-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
